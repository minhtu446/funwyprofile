<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>-FuNwy_</title>
  <meta name="description" content="About me — soft sky, lifelike drifting clouds, live Discord profile and a spinning vinyl player." />
  <meta property="og:title" content="-FuNwy_" />
  <meta property="og:description" content="About me — soft sky, lifelike drifting clouds, live Discord profile and a spinning vinyl player." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link id="favicon" rel="icon" href="" />

  <style>
    /* ============ COLORS ============ */
    :root {
      --ink: #233246;
      --ink-soft: #5a718c;
      --accent: #3d86f0;
      --accent2: #38b6ff;
      --glass: rgba(255, 255, 255, 0.5);
      --glass-border: rgba(255, 255, 255, 0.8);
      --online: #23a55a;
      --idle: #f0b232;
      --dnd: #f23f43;
      --offline: #80848e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Fit exactly one screen — no scrollbar */
    body {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: var(--ink);
      background: #dcecfb;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ============ SKY — time & weather themes ============ */
    .sky {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg,
        #8fc4f3 0%,
        #a9d3f7 30%,
        #cfe6fa 55%,
        #ecf4fb 78%,
        #fdf8f0 100%);
      overflow: hidden;
    }

    .sky-base,
    .sky-next {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        #8fc4f3 0%,
        #a9d3f7 30%,
        #cfe6fa 55%,
        #ecf4fb 78%,
        #fdf8f0 100%);
    }
    .sky-next { opacity: 0; transition: opacity 0.95s ease; }

    /* stars — only at night */
    .stars {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #eaf4ff;
      opacity: 0.7;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    .star.big {
      width: 3px;
      height: 3px;
      box-shadow: 0 0 6px 1px rgba(220, 240, 255, 0.8);
    }
    @keyframes twinkle {
      from { opacity: 0.2; }
      to   { opacity: 0.95; }
    }
    body[data-theme="night"] .stars { opacity: 1; }

    /* crescent moon — only at night */
    .moon {
      position: absolute;
      top: 9%;
      right: 13%;
      width: 58px;
      height: 58px;
      opacity: 0;
      transition: opacity 1.2s ease;
      filter: drop-shadow(0 0 20px rgba(255, 248, 220, 0.35));
      pointer-events: none;
    }
    body[data-theme="night"] .moon { opacity: 1; }

    /* rain streaks — only in the rain theme */
    .rain {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
      overflow: hidden;
      z-index: 4;
    }
    body[data-theme="rain"] .rain { opacity: 1; }
    .drop {
      position: absolute;
      top: -30px;
      width: 1.5px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(220, 235, 250, 0.7));
      border-radius: 2px;
      transform: rotate(8deg);
      animation: fall linear infinite;
    }
    @keyframes fall {
      to { transform: translateY(108vh) rotate(8deg); }
    }

    /* night readability */
    body[data-theme="night"] {
      --glass: rgba(22, 36, 60, 0.55);
      --glass-border: rgba(150, 190, 235, 0.3);
    }
    body[data-theme="night"] .profile-name {
      color: #eef5ff;
      text-shadow: 0 2px 18px rgba(8, 16, 32, 0.65);
    }
    body[data-theme="night"] .card,
    body[data-theme="night"] .widget { color: #e8f1fc; }
    body[data-theme="night"] .row-label,
    body[data-theme="night"] .w-date,
    body[data-theme="night"] .w-cond { color: rgba(210, 228, 250, 0.72); }
    body[data-theme="night"] .row-value { color: #eaf3ff; }
    body[data-theme="night"] .w-btn {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(150, 190, 235, 0.3);
      color: #cfe2f7;
    }
    body[data-theme="night"] .w-btn:hover { background: rgba(255, 255, 255, 0.18); }
    body[data-theme="night"] .w-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .haze {
      position: absolute;
      left: 0; right: 0; bottom: -12%;
      height: 48%;
      background: radial-gradient(62% 100% at 50% 100%,
        rgba(255, 251, 243, 0.85), rgba(255, 251, 243, 0) 72%);
      pointer-events: none;
    }

    .cloud-layer {
      position: absolute;
      inset: 0;
      transition: filter 1.2s ease;
    }

    .cloud-wrap {
      position: absolute;
      left: 0;
      will-change: transform;
      animation: drift var(--dur, 90s) linear infinite;
      animation-delay: var(--delay, 0s);
    }
    @keyframes drift {
      from { transform: translateX(-45vw); }
      to   { transform: translateX(125vw); }
    }

    .par { will-change: transform; }

    .cloud-svg {
      display: block;
      width: var(--w, 160px);
      height: calc(var(--w, 160px) * 0.64);
      opacity: var(--op, 0.95);
      filter: drop-shadow(0 20px 26px rgba(96, 140, 190, 0.18));
      animation: bob var(--bob, 8s) ease-in-out infinite alternate;
    }
    .far .cloud-svg { filter: blur(4px); }
    @keyframes bob {
      from { transform: translateY(0); }
      to   { transform: translateY(-10px); }
    }

    /* ============ HERO — Discord profile ============ */
    .hero {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* top padding keeps the thought bubble fully visible */
      padding: clamp(36px, 5vh, 64px) 20px 1vh;
    }

    .avatar-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 12px;
      animation: floatIn 1s cubic-bezier(.2,.7,.2,1) both;
    }
    #avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid #fff;
      box-shadow: 0 18px 42px rgba(70, 110, 165, 0.3);
      background: #dceeff;
    }
    #decoration {
      position: absolute;
      inset: -15%;
      width: 130%;
      height: 130%;
      pointer-events: none;
      display: none;
    }

    /* ---- Status badge — Discord-style shapes + hover tooltip ---- */
    #status-dot {
      position: absolute;
      right: 0;
      bottom: 2px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 6px solid #fff;
      background: transparent;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
      display: flex;
      cursor: default;
      z-index: 5;
    }
    #status-dot svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }

    .status-tip {
      position: absolute;
      bottom: calc(100% + 10px);
      right: -6px;
      background: rgba(24, 30, 44, 0.92);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 5px 9px;
      border-radius: 7px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.18s, transform 0.18s;
      z-index: 20;
    }
    .status-tip::after {
      content: "";
      position: absolute;
      top: 100%;
      right: 12px;
      border: 4px solid transparent;
      border-top-color: rgba(24, 30, 44, 0.92);
    }
    #status-dot:hover .status-tip {
      opacity: 1;
      transform: none;
    }

    /* ---- Thought bubble = custom status (always fully visible) ---- */
    .thought {
      position: absolute;
      top: -30px;
      right: -74px;
      z-index: 12;
    }
    .thought.hidden { display: none; }
    .t-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      box-shadow: 0 10px 26px rgba(70, 110, 165, 0.2);
      animation: thoughtFloat 3.5s ease-in-out infinite alternate;
    }
    @keyframes thoughtFloat {
      from { transform: translateY(0); }
      to   { transform: translateY(-6px); }
    }
    .thought::before {
      content: "";
      position: absolute;
      bottom: -15px;
      left: 14px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 10px rgba(70, 110, 165, 0.14);
    }
    .thought::after {
      content: "";
      position: absolute;
      bottom: -27px;
      left: 5px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 3px 8px rgba(70, 110, 165, 0.12);
    }
    .t-label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-name {
      font-size: clamp(1.25rem, 3.4vw, 1.8rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 16px rgba(255, 255, 255, 0.65);
      animation: floatIn 1s 0.12s cubic-bezier(.2,.7,.2,1) both;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }

    /* ============ INFO CARD — centered in the middle ============ */
    .card-zone {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 20px 24px;
    }

    .card {
      width: min(400px, 100%);
      padding: 3px 26px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 16px 44px rgba(70, 110, 165, 0.16);
      animation: floatIn 1s 0.3s cubic-bezier(.2,.7,.2,1) both;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
    }
    .row + .row { border-top: 1.5px dashed rgba(61, 134, 240, 0.25); }
    .row-label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--ink-soft);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex: none;
    }
    .row-value {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 500;
    }
    .row-value b { font-weight: 800; }
    .zodiac { color: var(--accent); font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }
    .zodiac svg { width: 19px; height: 19px; display: block; }

    /* ============ LOCKED NAME — long plain bar, no icon ============ */
    .secret {
      position: relative;
      cursor: pointer;
      width: 250px;
      max-width: 100%;
      height: 44px;
      border-radius: 13px;
      border: 1.5px solid rgba(61, 134, 240, 0.35);
      background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(212,236,255,0.92));
      box-shadow: 0 6px 16px rgba(61, 134, 240, 0.12);
      overflow: hidden;
      padding: 0;
      font: inherit;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .secret::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(115deg,
        rgba(61, 134, 240, 0.12) 0 9px,
        rgba(61, 134, 240, 0) 9px 20px);
      pointer-events: none;
    }
    .secret::after {
      content: "";
      position: absolute;
      inset: 9px 16px;
      border-radius: 9px;
      background: linear-gradient(90deg,
        rgba(110, 165, 225, 0.4),
        rgba(110, 165, 225, 0.16),
        rgba(110, 165, 225, 0.4));
      filter: blur(7px);
      pointer-events: none;
    }
    .secret:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(61, 134, 240, 0.22);
    }
    .secret:active { transform: scale(0.98); }

    /* ============ WEATHER & THEME WIDGET — bottom-left ============ */
    .widget {
      position: fixed;
      left: 16px;
      bottom: 14px;
      z-index: 30;
      width: 196px;
      padding: 12px 14px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 16px 40px rgba(70, 110, 165, 0.18);
      animation: floatIn 1s 0.5s cubic-bezier(.2,.7,.2,1) both;
    }
    .w-clock {
      font-size: 1.42rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .w-date {
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--ink-soft);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .w-weather {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
      min-width: 0;
    }
    .w-weather svg { width: 22px; height: 22px; flex: none; display: block; }
    .w-temp { font-weight: 800; font-size: 0.94rem; flex: none; }
    .w-cond {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .w-themes {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }
    .w-btn {
      border: 1px solid rgba(61, 134, 240, 0.25);
      background: rgba(255, 255, 255, 0.55);
      color: var(--ink-soft);
      font: inherit;
      font-size: 0.63rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .w-btn:hover { background: rgba(61, 134, 240, 0.12); }
    .w-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ============ VINYL PLAYER — fixed bottom-right corner ============ */
    .player {
      position: fixed;
      right: 18px;
      bottom: 14px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: floatIn 1s 0.42s cubic-bezier(.2,.7,.2,1) both;
    }

    /* Black vinyl disc, hand-drawn — outer keeps hover/scale,
       inner layer spins (no transform conflicts) */
    .disc {
      --size: 120px;
      width: var(--size);
      height: var(--size);
      position: relative;
      border: none;
      padding: 0;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(20, 30, 50, 0.4);
      transition: transform 0.2s;
    }
    .disc:hover { transform: scale(1.05); }
    .disc:active { transform: scale(0.96); }

    .disc-inner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at 50% 50%,
          rgba(255, 255, 255, 0.055) 0 1.5px,
          rgba(255, 255, 255, 0) 1.5px 5px),
        radial-gradient(circle at 50% 50%,
          #2a2e38 0%,
          #14161d 55%,
          #0b0d12 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      will-change: transform;
    }

    .disc.spinning .disc-inner { animation: spin 2s linear infinite; }
    @keyframes spin { to { transform: rotate(1turn); } }

    /* static light streaks — stay put while the vinyl spins beneath */
    .disc::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(125deg,
        rgba(255, 255, 255, 0) 30%,
        rgba(255, 255, 255, 0.16) 44%,
        rgba(255, 255, 255, 0) 56%,
        rgba(255, 255, 255, 0.1) 68%,
        rgba(255, 255, 255, 0) 78%);
      pointer-events: none;
      z-index: 1;
    }

    /* play hint — appears on hover while paused */
    .disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-30%, -50%);
      border-style: solid;
      border-width: 9px 0 9px 15px;
      border-color: transparent transparent transparent rgba(255, 255, 255, 0.9);
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 4;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.6));
    }
    .disc:not(.spinning):hover::before { opacity: 1; }

    /* center label = Better Days cover art */
    .disc-label {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 46px;
      height: 46px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 0 3px rgba(11, 13, 18, 0.55), 0 2px 8px rgba(0, 0, 0, 0.5);
      background: #14161d;
      z-index: 2;
    }
    .disc-label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .disc-hole {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #0b0d12;
      border: 2px solid rgba(255, 255, 255, 0.5);
      z-index: 3;
    }

    /* volume slider below the disc */
    .volume {
      -webkit-appearance: none;
      appearance: none;
      width: 120px;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg,
        var(--accent) var(--fill, 70%),
        rgba(255, 255, 255, 0.75) var(--fill, 70%));
      outline: none;
      box-shadow: 0 2px 8px rgba(70, 110, 165, 0.25);
      cursor: pointer;
    }
    .volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      box-shadow: 0 2px 8px rgba(61, 134, 240, 0.45);
    }
    .volume::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      box-shadow: 0 2px 8px rgba(61, 134, 240, 0.45);
    }

    /* ---- Hidden YouTube player (music for the vinyl) ---- */
    #yt-player {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 200px;
      height: 112px;
      opacity: 0.01;
      pointer-events: none;
      z-index: -1;
    }

    /* ---- Rick roll overlay ---- */
    .meme {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 14, 24, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }
    .meme.open { opacity: 1; pointer-events: auto; }
    .meme-box {
      position: relative;
      width: min(640px, 92vw);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      transform: scale(0.9);
      transition: transform 0.35s;
    }
    .meme.open .meme-box { transform: scale(1); }
    #meme-player, #meme-player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .meme-close {
      position: absolute;
      top: 8px;
      right: 10px;
      z-index: 5;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 1.3rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .meme-close:hover { background: rgba(255, 255, 255, 0.3); }

    /* ---- Screen shake on click (single shake + sound effect) ---- */
    body.shake-a { animation: pageShakeA 0.55s cubic-bezier(.36,.07,.19,.97) both; }
    body.shake-b { animation: pageShakeB 0.6s  cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes pageShakeA {
      10% { transform: translate(-7px, 3px) rotate(-0.4deg); }
      20% { transform: translate(6px, -4px) rotate(0.4deg); }
      30% { transform: translate(-5px, 3px); }
      40% { transform: translate(6px, -2px); }
      50% { transform: translate(-5px, 2px); }
      60% { transform: translate(4px, 2px); }
      70% { transform: translate(-3px, -2px); }
      80% { transform: translate(2px, 1px); }
      90% { transform: translate(-1px, 0); }
    }
    @keyframes pageShakeB {
      12% { transform: translate(6px, -3px) rotate(0.5deg); }
      24% { transform: translate(-7px, 3px) rotate(-0.5deg); }
      36% { transform: translate(5px, 3px); }

  <script>
    /* ================================================================
       1. CLOUDS — lifelike SVG (turbulence edges), 3 depth layers,
          phase-offset drift so they never repeat in sync
    ================================================================ */
    (function makeClouds() {
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(20261112);
      const layer = document.getElementById("clouds");
      const SYMBOLS = ["cloud-a", "cloud-b", "cloud-c", "cloud-d"];
      const NS = "http://www.w3.org/2000/svg";
      const parallaxItems = [];
      const COUNT = 16;

      for (let i = 0; i < COUNT; i++) {
        const r = rand();
        const L = r < 0.42 ? "far" : r < 0.76 ? "mid" : "near";
        const cfg = {
          far:  { wMin: 80,  wMax: 180, opMin: 0.5,  opMax: 0.68, durMin: 95,  durMax: 185, depth: 0.05, topMax: 44 },
          mid:  { wMin: 130, wMax: 250, opMin: 0.75, opMax: 0.92, durMin: 70,  durMax: 145, depth: 0.1,  topMax: 54 },
          near: { wMin: 200, wMax: 350, opMin: 0.9,  opMax: 1,    durMin: 55,  durMax: 115, depth: 0.16, topMax: 60 },
        }[L];

        const w   = Math.round(cfg.wMin + rand() * (cfg.wMax - cfg.wMin));
        const dur = Math.round(cfg.durMin + rand() * (cfg.durMax - cfg.durMin));

        const wrap = document.createElement("div");
        wrap.className = "cloud-wrap " + L;
        wrap.style.setProperty("--dur", dur + "s");
        wrap.style.setProperty("--delay", (-rand() * dur).toFixed(1) + "s");
        wrap.style.top = (2 + rand() * cfg.topMax).toFixed(1) + "%";
        wrap.style.zIndex = L === "near" ? 3 : L === "mid" ? 2 : 1;

        const par = document.createElement("div");
        par.className = "par";
        parallaxItems.push({ el: par, depth: cfg.depth });

        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "0 0 220 140");
        svg.classList.add("cloud-svg");
        svg.style.setProperty("--w", w + "px");
        svg.style.setProperty("--op", (cfg.opMin + rand() * (cfg.opMax - cfg.opMin)).toFixed(2));
        svg.style.setProperty("--bob", (6 + rand() * 5).toFixed(1) + "s");

        const use = document.createElementNS(NS, "use");
        use.setAttribute("href", "#" + SYMBOLS[Math.floor(rand() * SYMBOLS.length)]);
        svg.appendChild(use);

        par.appendChild(svg);
        wrap.appendChild(par);
        layer.appendChild(wrap);
      }

      /* Parallax on scroll (kept for tall screens) */
      let ticking = false;
      window.addEventListener("scroll", () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          const y = window.scrollY;
          parallaxItems.forEach((it) => {
            it.el.style.transform = "translateY(" + y * it.depth + "px)";
          });
          ticking = false;
        });
      }, { passive: true });
    })();

    /* ================================================================
       2. LOCKED NAME + VINYL PLAYER + RICK ROLL
          - lock click: one screen shake + synthesized denied sound
            + rick roll overlay that closes when the video ends
          - disc click: play/pause Better Days, vinyl spins while playing
          - slider: live volume
    ================================================================ */
    (function lockAndPlayer() {
      const secret = document.getElementById("secret");
      const disc = document.getElementById("disc");
      const volume = document.getElementById("volume");
      const meme = document.getElementById("meme");
      const memeClose = document.getElementById("meme-close");
      let busy = false;
      let alt = false;
      let audioCtx = null;
      let ytPlayer = null;
      let wantMusic = false;
      let playing = false;
      let memePlayer = null;
      let memeWanted = false;

      /* Spinning — CSS animation with a JS rAF fallback for browsers
         that disable CSS animations (reduced motion) */
      const discInner = disc.querySelector(".disc-inner");
      const reducedMotion =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let rafId = null;
      let rotDeg = 0;
      let lastT = 0;

      function spinLoop(t) {
        if (lastT) {
          const dt = Math.min((t - lastT) / 1000, 0.1);
          rotDeg = (rotDeg + 180 * dt) % 360; /* 2s per turn */
          discInner.style.transform = "rotate(" + rotDeg + "deg)";
        }
        lastT = t;
        rafId = requestAnimationFrame(spinLoop);
      }

      function setSpin(on) {
        disc.setAttribute("aria-pressed", on ? "true" : "false");
        if (reducedMotion) {
          if (on && rafId == null) { lastT = 0; rafId = requestAnimationFrame(spinLoop); }
          if (!on && rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
        } else {
          disc.classList.toggle("spinning", on);
          if (!on) discInner.style.transform = "";
        }
      }

      /* Synthesized "access denied" sound effect — no external file needed */
      function playDenied() {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const t = audioCtx.currentTime;

          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          const lp = audioCtx.createBiquadFilter();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(130, t);
          osc.frequency.exponentialRampToValueAtTime(55, t + 0.22);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.16, t + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
          lp.type = "lowpass";
          lp.frequency.value = 900;
          osc.connect(g);
          g.connect(lp);
          lp.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.28);

          const len = Math.floor(audioCtx.sampleRate * 0.06);
          const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          const hp = audioCtx.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 1400;
          const ng = audioCtx.createGain();
          ng.gain.value = 0.07;
          src.connect(hp);
          hp.connect(ng);
          ng.connect(audioCtx.destination);
          src.start(t);
        } catch { /* audio unavailable — shake still runs */ }
      }

      /* ---- Rick roll overlay ---- */
      function openMeme() {
        meme.classList.add("open");
        meme.setAttribute("aria-hidden", "false");
        if (memePlayer) {
          try {
            memePlayer.seekTo(0, true);
            memePlayer.playVideo();
          } catch { /* player busy — still visible */ }
        } else {
          memeWanted = true;
          createMemePlayer();
        }
      }

      function closeMeme() {
        meme.classList.remove("open");
        meme.setAttribute("aria-hidden", "true");
        try { if (memePlayer) memePlayer.pauseVideo(); } catch { /* ignore */ }
      }

      function createMemePlayer() {
        if (memePlayer || typeof YT === "undefined" || !YT.Player) return;
        memePlayer = new YT.Player("meme-player", {
          videoId: "dQw4w9WgXcQ",
          playerVars: { autoplay: 1, rel: 0, playsinline: 1, modestbranding: 1 },
          events: {
            onReady: (e) => { e.target.playVideo(); },
            onStateChange: (e) => {
              /* auto-close when the meme finishes playing */
              if (e.data === YT.PlayerState.ENDED) closeMeme();
            },
          },
        });
      }

      memeClose.addEventListener("click", closeMeme);

      /* ---- Hidden YouTube music: LAKEY INSPIRED - Better Days (1 Hour) ---- */
      window.onYouTubeIframeAPIReady = function () {
        ytPlayer = new YT.Player("yt-player", {
          videoId: "DkhUCvm1jQc",
          playerVars: {
            autoplay: 0,
            controls: 0,
            loop: 1,
            playlist: "DkhUCvm1jQc",
            playsinline: 1,
            rel: 0,
            modestbranding: 1,
            iv_load_policy: 3,
          },
          events: {
            onReady: (e) => {
              e.target.setVolume(volume.value);
              if (wantMusic) {
                wantMusic = false;
                playMusic();
              }
              if (memeWanted) createMemePlayer();
            },
            onStateChange: (e) => {
              /* keep the vinyl spinning in sync with playback */
              if (e.data === YT.PlayerState.PLAYING) {
                playing = true;
                setSpin(true);
              } else if (e.data === YT.PlayerState.PAUSED) {
                playing = false;
                setSpin(false);
              } else if (e.data === YT.PlayerState.ENDED) {
                /* safety loop — replay immediately, keep spinning */
                playing = false;
                e.target.playVideo();
              }
            },
          },
        });
      };

      /* Load the IFrame API only after our callback is registered */
      (function loadYT() {
        const s = document.createElement("script");
        s.src = "https://www.youtube.com/iframe_api";
        s.async = true;
        document.head.appendChild(s);
      })();

      function playMusic() {
        if (!ytPlayer) return;
        try {
          ytPlayer.unMute();
          ytPlayer.setVolume(volume.value);
          ytPlayer.playVideo();
        } catch { /* player not ready yet */ }
      }

      disc.addEventListener("click", () => {
        if (!ytPlayer) {
          /* player still loading — spin optimistically, play when ready */
          wantMusic = !wantMusic;
          setSpin(wantMusic);
          return;
        }
        try {
          if (playing) { setSpin(false); ytPlayer.pauseVideo(); }
          else { setSpin(true); playMusic(); }
        } catch { /* ignore */ }
      });

      volume.addEventListener("input", () => {
        volume.style.setProperty("--fill", volume.value + "%");
        try { if (ytPlayer) ytPlayer.setVolume(volume.value); } catch { /* ignore */ }
      });

      secret.addEventListener("click", () => {
        if (busy) return;
        busy = true;

        playDenied();
        openMeme();

        document.body.classList.remove("shake-a", "shake-b");
        void document.body.offsetWidth;
        document.body.classList.add(alt ? "shake-b" : "shake-a");
        alt = !alt;
        setTimeout(() => document.body.classList.remove("shake-a", "shake-b"), 720);

        setTimeout(() => { busy = false; }, 760);
      });
    })();

    /* ================================================================
       3. DISCORD LIVE — avatar, name, status badge, bubble (Lanyard)
    ================================================================ */
    (function discord() {
      const ID = "1464884102238048307";
      const REST = "https://api.lanyard.rest/v1/users/" + ID;
      const WS = "wss://api.lanyard.rest/socket";

      const $ = (id) => document.getElementById(id);
      const avatarEl = $("avatar");
      const decoEl = $("decoration");
      const statusIcon = $("status-icon");
      const statusTip = $("status-tip");
      const thoughtEl = $("thought");
      const thoughtLabel = $("thought-label");
      const nameEl = $("display-name");

      const LABELS = {
        online: "Online",
        idle: "Idle",
        dnd: "Do Not Disturb",
        offline: "Offline",
      };

      const FALLBACK_AVATAR =
        "data:image/svg+xml," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">' +
          '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="#4facfe"/><stop offset="1" stop-color="#00f2fe"/>' +
          "</linearGradient></defs>" +
          '<rect width="128" height="128" fill="url(#g)"/>' +
          '<text x="64" y="86" font-family="Arial" font-size="64" font-weight="bold" fill="#fff" text-anchor="middle">F</text></svg>'
        );

      /* One icon only — swapped per status, Discord-style shapes */
      const ICONS = {
        online: '<circle cx="10" cy="10" r="10" fill="#23a55a"/>',
        idle: '<mask id="idleM"><rect width="20" height="20" fill="#fff"/><circle cx="13" cy="6" r="7.5" fill="#000"/></mask><circle cx="10" cy="10" r="10" fill="#f0b232" mask="url(#idleM)"/>',
        dnd: '<circle cx="10" cy="10" r="10" fill="#f23f43"/><rect x="4.5" y="8" width="11" height="4" rx="2" fill="#fff"/>',
        offline: '<circle cx="10" cy="10" r="7.75" fill="none" stroke="#80848e" stroke-width="4.5"/>',
      };

      function setStatus(status) {
        const key = LABELS[status] ? status : "offline";
        if (statusIcon.dataset.status !== key) {
          statusIcon.innerHTML = ICONS[key];
          statusIcon.dataset.status = key;
        }
        statusTip.textContent = LABELS[key];
      }

      function defaultAvatar(id) {
        try {
          const idx = Number((BigInt(id) >> 5n) % 6n);
          return "https://cdn.discordapp.com/embed/avatars/" + idx + ".png";
        } catch { return "https://cdn.discordapp.com/embed/avatars/0.png"; }
      }

      function avatarURL(u) {
        if (!u.avatar) return defaultAvatar(u.id);
        const ext = u.avatar.startsWith("a_") ? "gif" : "png";
        return "https://cdn.discordapp.com/avatars/" + u.id + "/" + u.avatar + "." + ext + "?size=256";
      }

      function decorationURL(asset) {
        return "https://cdn.discordapp.com/avatar-decoration-presets/" + asset + ".png?passthrough=false&size=240";
      }

      avatarEl.onerror = () => { avatarEl.src = FALLBACK_AVATAR; };
      decoEl.onerror = () => { decoEl.style.display = "none"; };

      let firstPresence = true;
      function applyPresence(d) {
        const u = d.discord_user || {};
        const status = d.discord_status;

        nameEl.textContent = u.display_name || u.global_name || u.username || "-FuNwy_";

        const url = avatarURL(u);
        if (avatarEl.src !== url) avatarEl.src = url;
        if (firstPresence) {
          document.getElementById("favicon").href = url;
          firstPresence = false;
        }
        if (u.avatar_decoration_data && u.avatar_decoration_data.asset) {
          decoEl.src = decorationURL(u.avatar_decoration_data.asset);
          decoEl.style.display = "block";
        } else {
          decoEl.style.display = "none";
        }

        setStatus(status);

        /* Bubble only appears when a custom status exists */
        const custom = (d.activities || []).find((a) => a.type === 4 && a.state);
        if (custom) {
          thoughtLabel.textContent = custom.state;
          thoughtEl.classList.remove("hidden");
        } else {
          thoughtEl.classList.add("hidden");
        }
      }

      /* REST: instant first load */
      fetch(REST)
        .then((r) => r.json())
        .then((res) => { if (res.success) applyPresence(res.data); })
        .catch(() => setStatus("offline"));

      /* WebSocket: realtime updates */
      let ws = null;
      let hbTimer = null;
      let reconnectTimer = null;
      let pollTimer = null;

      function connect() {
        try { ws = new WebSocket(WS); } catch { return scheduleReconnect(); }

        ws.onopen = () => { clearInterval(pollTimer); };
        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          if (msg.op === 1) {
            ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: ID } }));
            clearInterval(hbTimer);
            hbTimer = setInterval(
              () => ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })),
              (msg.d && msg.d.heartbeat_interval) || 30000
            );
          } else if (msg.op === 0) {
            applyPresence(msg.d);
          }
        };
        ws.onclose = () => {
          clearInterval(hbTimer);
          scheduleReconnect();
        };
        ws.onerror = () => { try { ws.close(); } catch {} };
      }

      function scheduleReconnect() {
        if (!pollTimer) {
          pollTimer = setInterval(() => {
            fetch(REST).then((r) => r.json()).then((res) => {
              if (res.success) applyPresence(res.data);
            }).catch(() => {});
          }, 30000);
        }
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 5000);
      }

      connect();
    })();

    /* ================================================================
       4. SKY THEMES — Vietnam clock, HCMC weather, background control
    ================================================================ */
    (function skyWeather() {
      const THEMES = {
        morning: {
          sky: "linear-gradient(180deg, #8fc4f3 0%, #a9d3f7 30%, #cfe6fa 55%, #ecf4fb 78%, #fdf8f0 100%)",
          cloudFilter: "none",
        },
        afternoon: {
          sky: "linear-gradient(180deg, #62aef4 0%, #8fcafa 32%, #c2e5fd 58%, #edf7ff 80%, #fdf7ec 100%)",
          cloudFilter: "brightness(1.04)",
        },
        evening: {
          sky: "linear-gradient(180deg, #6873b8 0%, #a58ac7 28%, #e6a68c 58%, #f6c8a2 78%, #fde9d0 100%)",
          cloudFilter: "sepia(0.3) brightness(0.9) hue-rotate(-12deg)",
        },
        night: {
          sky: "linear-gradient(180deg, #0a1830 0%, #122c52 35%, #1d4370 62%, #2c5a86 82%, #3b6d97 100%)",
          cloudFilter: "brightness(0.42) saturate(0.65)",
        },
        rain: {
          sky: "linear-gradient(180deg, #5d6d7d 0%, #7b8a98 35%, #9eacb7 60%, #c2ccd4 82%, #dce3e7 100%)",
          cloudFilter: "grayscale(0.55) brightness(0.8)",
        },
      };

      /* Self-drawn weather icons (English labels, no emoji) */
      const WX_ICONS = {
        sun: '<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="4.4" fill="#f0b232"/><g stroke="#f0b232" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></g></svg>',
        moon: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="#e6d98a"/></svg>',
        cloud: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 18h10a4 4 0 0 0 .9-7.9 5.5 5.5 0 0 0-10.7-.7A4.3 4.3 0 0 0 7 18z" fill="#9fb3c8"/></svg>',
        partly: '<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="9" cy="8.6" r="3.3" fill="#f0b232"/><path d="M11.4 19h6.6a3.2 3.2 0 0 0 .7-6.3 4.4 4.4 0 0 0-8.4-1.3A3.5 3.5 0 0 0 11.4 19z" fill="#b9c9d8"/></svg>',
        moonCloud: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M15.5 4.2a5.6 5.6 0 0 0 3 7.6A6.5 6.5 0 1 1 15.5 4.2z" fill="#e6d98a"/><path d="M11.4 19h6.6a3.2 3.2 0 0 0 .7-6.3 4.4 4.4 0 0 0-8.4-1.3A3.5 3.5 0 0 0 11.4 19z" fill="#a8bbc9"/></svg>',
        rain: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 14.5h10a4 4 0 0 0 .9-7.9 5.5 5.5 0 0 0-10.7-.7A4.3 4.3 0 0 0 7 14.5z" fill="#9fb3c8"/><g stroke="#5aa7e8" stroke-width="1.8" stroke-linecap="round"><path d="M9 17.5l-1 2.4M12.5 17.5l-1 2.4M16 17.5l-1 2.4"/></g></svg>',
        storm: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 14h10a4 4 0 0 0 .9-7.9 5.5 5.5 0 0 0-10.7-.7A4.3 4.3 0 0 0 7 14z" fill="#8a9dae"/><path d="M13 15l-2.6 3.8h2.2L11.2 22l3.8-4.2h-2.2l1.2-2.8z" fill="#f0c04a"/></svg>',
      };

      const skyBase = document.getElementById("sky-base");
      const skyNext = document.getElementById("sky-next");
      const cloudsEl = document.getElementById("clouds");
      const starsEl = document.getElementById("stars");
      const rainEl = document.getElementById("rain");
      const clockEl = document.getElementById("w-clock");
      const dateEl = document.getElementById("w-date");
      const iconEl = document.getElementById("w-icon");
      const tempEl = document.getElementById("w-temp");
      const condEl = document.getElementById("w-cond");
      const buttons = Array.from(document.querySelectorAll(".w-btn"));

      /* ---- stars & rain decoration ---- */
      for (let i = 0; i < 110; i++) {
        const s = document.createElement("i");
        const big = Math.random() < 0.12;
        s.className = "star" + (big ? " big" : "");
        s.style.left = (Math.random() * 100).toFixed(2) + "%";
        s.style.top = (Math.random() * 62).toFixed(2) + "%";
        s.style.animationDelay = (Math.random() * 4).toFixed(2) + "s";
        s.style.animationDuration = (2.5 + Math.random() * 3.5).toFixed(2) + "s";
        starsEl.appendChild(s);
      }
      for (let i = 0; i < 42; i++) {
        const d = document.createElement("i");
        d.className = "drop";
        d.style.left = (Math.random() * 100).toFixed(2) + "%";
        d.style.height = Math.round(14 + Math.random() * 14) + "px";
        d.style.opacity = (0.25 + Math.random() * 0.35).toFixed(2);
        d.style.animationDelay = (Math.random() * 1.6).toFixed(2) + "s";
        d.style.animationDuration = (0.75 + Math.random() * 0.7).toFixed(2) + "s";
        rainEl.appendChild(d);
      }

      /* ---- Vietnam clock (always UTC+7) ---- */
      const timeFmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Ho_Chi_Minh",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hourCycle: "h23",
      });
      const dateFmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Ho_Chi_Minh",
        weekday: "short", day: "2-digit", month: "short",
      });
      const hourFmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Ho_Chi_Minh",
        hour: "2-digit", hourCycle: "h23",
      });

      function vnHour() {
        return Number(hourFmt.format(new Date()));
      }
      function tickClock() {
        clockEl.textContent = timeFmt.format(new Date());
        dateEl.textContent = dateFmt.format(new Date());
      }

      /* ---- weather: Ho Chi Minh City via Open-Meteo (free, no key) ---- */
      const WX_URL = "https://api.open-meteo.com/v1/forecast" +
        "?latitude=10.8231&longitude=106.6297" +
        "&current=temperature_2m,weather_code,is_day" +
        "&timezone=Asia%2FHo_Chi_Minh";
      const wx = { temp: null, rainy: false, label: "", icon: "cloud" };

      function wxInfo(code, isDay) {
        if (code === 0) return { label: "Clear", icon: isDay ? "sun" : "moon", rainy: false };
        if (code === 1 || code === 2) return { label: "Partly cloudy", icon: isDay ? "partly" : "moonCloud", rainy: false };
        if (code === 3) return { label: "Overcast", icon: "cloud", rainy: false };
        if (code === 45 || code === 48) return { label: "Fog", icon: "cloud", rainy: false };
        if (code >= 51 && code <= 57) return { label: "Drizzle", icon: "rain", rainy: true };
        if (code >= 61 && code <= 67) return { label: "Rain", icon: "rain", rainy: true };
        if (code >= 71 && code <= 77) return { label: "Snow", icon: "rain", rainy: true };
        if (code >= 80 && code <= 82) return { label: "Showers", icon: "rain", rainy: true };
        if (code >= 85 && code <= 86) return { label: "Snow showers", icon: "rain", rainy: true };
        if (code >= 95) return { label: "Thunderstorm", icon: "storm", rainy: true };
        return { label: "—", icon: "cloud", rainy: false };
      }

      function renderWeather() {
        iconEl.innerHTML = WX_ICONS[wx.icon] || WX_ICONS.cloud;
        tempEl.textContent = wx.temp == null ? "--°C" : wx.temp + "°C";
        condEl.textContent = wx.label || "—";
      }

      function fetchWeather() {
        fetch(WX_URL)
          .then((r) => r.json())
          .then((d) => {
            const c = d && d.current;
            if (!c) return;
            wx.temp = Math.round(c.temperature_2m);
            const info = wxInfo(c.weather_code, c.is_day !== 0);
            wx.label = info.label;
            wx.icon = info.icon;
            wx.rainy = info.rainy;
            renderWeather();
            refreshTheme();
          })
          .catch(() => { /* offline — time-based themes still work */ });
      }

      /* ---- theme control ---- */
      const SAVE_KEY = "funwy-theme";
      let mode = "auto";
      try { mode = localStorage.getItem(SAVE_KEY) || "auto"; } catch { mode = "auto"; }
      if (mode !== "auto" && !THEMES[mode]) mode = "auto";

      let currentTheme = "";
      let fadeTimer = null;

      function autoTheme() {
        const h = vnHour();
        if (wx.rainy) return "rain";
        if (h >= 5 && h < 12) return "morning";
        if (h >= 12 && h < 17) return "afternoon";
        if (h >= 17 && h < 20) return "evening";
        return "night";
      }
      function activeTheme() {
        return mode === "auto" ? autoTheme() : mode;
      }

      function applyTheme(name) {
        if (!THEMES[name] || name === currentTheme) return;
        currentTheme = name;
        document.body.dataset.theme = name;
        skyNext.style.background = THEMES[name].sky;
        skyNext.style.opacity = "1";
        cloudsEl.style.filter = THEMES[name].cloudFilter;
        clearTimeout(fadeTimer);
        fadeTimer = setTimeout(() => {
          skyBase.style.background = THEMES[name].sky;
          skyNext.style.opacity = "0";
        }, 980);
      }

      function markActive() {
        buttons.forEach((b) => {
          b.classList.toggle("active", b.dataset.t === mode);
        });
      }
      function refreshTheme() {
        applyTheme(activeTheme());
        markActive();
      }

      buttons.forEach((b) => {
        b.addEventListener("click", () => {
          mode = b.dataset.t;
          try { localStorage.setItem(SAVE_KEY, mode); } catch { /* private mode */ }
          refreshTheme();
        });
      });

      /* ---- boot ---- */
      tickClock();
      setInterval(() => {
        tickClock();
        if (mode === "auto") refreshTheme();
      }, 1000);
      renderWeather();
      refreshTheme();
      fetchWeather();
      setInterval(fetchWeather, 600000);
    })();
  </script>
